<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" role="img" aria-label="DXR path tracer: camera medium seed, nearest geometric endpoint, segment medium tracking, surface or phase sampling, and emission MIS in TracePath"><title>DXR Path Tracer</title><style>text{font-family:Consolas,"Liberation Mono",Menlo,monospace}
.nd{stroke-width:1.3}
.nd.strong{stroke-width:2}
.t{font-size:12.5px;font-weight:700}
.s{font-size:10.5px;fill:#5A6676}
.grp{stroke-width:1.3;stroke-dasharray:6 5}
.gl{font-size:11.5px;font-weight:700;letter-spacing:.03em}
.frm{fill:none;stroke:#D3DAE2;stroke-width:1.4;stroke-dasharray:6 5}
.e{fill:none;stroke:#18212C;stroke-width:1.4;stroke-linejoin:round}
.e.dash{stroke:#5A6676;stroke-dasharray:5 4}
.e.thin{stroke:#D3DAE2;stroke-width:1.4}
.mk{fill:#18212C} .mkd{fill:#5A6676}
.mkh{fill:#FBFCFD;stroke:#18212C;stroke-width:1.4;stroke-linejoin:round}
.lbl{font-size:10.5px;fill:#5A6676;paint-order:stroke;stroke:#FBFCFD;stroke-width:4px;stroke-linejoin:round}
.cap{font-size:11px;font-weight:700;fill:#5A6676;letter-spacing:.04em}
.k-app .nd{fill:#E8ECF1;stroke:#A9B3C1} .k-app .t{fill:#4A5568} .k-app .grp{fill:none;stroke:#A9B3C1} .k-app .gl{fill:#4A5568}
.k-eng .nd{fill:#DCEFF3;stroke:#8CC3CE} .k-eng .t{fill:#0B6E80} .k-eng .grp{fill:none;stroke:#8CC3CE} .k-eng .gl{fill:#0B6E80}
.k-com .nd{fill:#E6E5FA;stroke:#9D98E6} .k-com .t{fill:#4B44C9} .k-com .grp{fill:none;stroke:#9D98E6} .k-com .gl{fill:#4B44C9}
.k-dx .nd{fill:#DDF0E3;stroke:#96CDA8} .k-dx .t{fill:#1C7A3E} .k-dx .grp{fill:none;stroke:#96CDA8} .k-dx .gl{fill:#1C7A3E}
.k-vk .nd{fill:#F7E1DD;stroke:#E0A39B} .k-vk .t{fill:#AE2A1E} .k-vk .grp{fill:none;stroke:#E0A39B} .k-vk .gl{fill:#AE2A1E}
.k-ext .nd{fill:#EFE8DE;stroke:#C8B69D} .k-ext .t{fill:#7A6448} .k-ext .grp{fill:none;stroke:#C8B69D} .k-ext .gl{fill:#7A6448}
.k-cpu .nd{fill:#E8ECF1;stroke:#A9B3C1} .k-cpu .t{fill:#4A5568} .k-cpu .grp{fill:none;stroke:#A9B3C1} .k-cpu .gl{fill:#4A5568}
.k-cmp .nd{fill:#DCEFF3;stroke:#8CC3CE} .k-cmp .t{fill:#0B6E80} .k-cmp .grp{fill:none;stroke:#8CC3CE} .k-cmp .gl{fill:#0B6E80}
.k-mesh .nd{fill:#E6E5FA;stroke:#9D98E6} .k-mesh .t{fill:#4B44C9} .k-mesh .grp{fill:none;stroke:#9D98E6} .k-mesh .gl{fill:#4B44C9}
.k-rt .nd{fill:#FBE6DA;stroke:#E6A98A} .k-rt .t{fill:#B4431A} .k-rt .grp{fill:none;stroke:#E6A98A} .k-rt .gl{fill:#B4431A}
.k-logic .nd{fill:#FBFCFD;stroke:#8F9AAA} .k-logic .t{fill:#3C4656} .k-logic .grp{fill:none;stroke:#8F9AAA} .k-logic .gl{fill:#3C4656}
.k-res .nd{fill:#EFE8DE;stroke:#C8B69D} .k-res .t{fill:#7A6448} .k-res .grp{fill:none;stroke:#C8B69D} .k-res .gl{fill:#7A6448}
</style><rect width="100%" height="100%" fill="#FBFCFD"/><defs><marker id="p-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path class="mk" d="M0,0.5 L10,5 L0,9.5 Z"/></marker><marker id="p-ad" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path class="mkd" d="M0,0.5 L10,5 L0,9.5 Z"/></marker></defs><rect class="frm" x="430" y="20" width="650" height="560" rx="10"/><text class="cap" x="1060" y="43" text-anchor="end">TracePath() · one iterative path</text><path class="e" d="M107,96 L107,135" marker-end="url(#p-a)"/><path class="e" d="M195,163 L212,163 L212,296 L240,296" marker-end="url(#p-a)"/><path class="e" d="M195,267 L212,267 L212,318 L240,318" marker-end="url(#p-a)"/><path class="e" d="M320,204 L320,280" marker-end="url(#p-a)"/><path class="e" d="M400,314 L418,314 L418,106 L460,106" marker-end="url(#p-a)"/><path class="e" d="M755,144 L755,195" marker-end="url(#p-a)"/><path class="e" d="M675,275 L590,315" marker-end="url(#p-a)"/><path class="e" d="M835,275 L920,315" marker-end="url(#p-a)"/><path class="e" d="M590,397 L590,485 L620,485" marker-end="url(#p-a)"/><path class="e" d="M920,437 L920,485 L890,485" marker-end="url(#p-a)"/><path class="e" d="M755,530 L755,556 L444,556 L444,106 L460,106" marker-end="url(#p-a)"/><path class="e" d="M320,348 L320,636 L620,636" marker-end="url(#p-a)"/><path class="e" d="M805,636 L850,636" marker-end="url(#p-a)"/><path class="e dash" d="M1050,364 L1064,364 L1064,106 L1050,106" marker-end="url(#p-ad)"/><g class="k-res"><rect class="nd" x="20" y="40" width="175" height="56" rx="7"/><text class="t" x="107.5" y="65.0" text-anchor="middle">BLAS</text><text class="s" x="107.5" y="81.0" text-anchor="middle">per mesh</text></g><g class="k-res"><rect class="nd" x="20" y="135" width="175" height="56" rx="7"/><text class="t" x="107.5" y="160.0" text-anchor="middle">TLAS</text><text class="s" x="107.5" y="176.0" text-anchor="middle">instances</text></g><g class="k-res"><rect class="nd" x="20" y="230" width="175" height="74" rx="7"/><text class="t" x="107.5" y="256.0" text-anchor="middle">Shader Binding Table</text><text class="s" x="107.5" y="272.0" text-anchor="middle">RayGen · 2 Miss</text><text class="s" x="107.5" y="288.0" text-anchor="middle">2 Hit Groups</text></g><g class="k-cmp"><rect class="nd" x="225" y="120" width="190" height="84" rx="7"/><text class="t" x="320.0" y="151.0" text-anchor="middle">PrimaryMediumQueryCS</text><text class="s" x="320.0" y="167.0" text-anchor="middle">camera containment</text><text class="s" x="320.0" y="183.0" text-anchor="middle">host + air seed</text></g><g class="k-rt"><rect class="nd strong" x="240" y="280" width="160" height="68" rx="7"/><text class="t" x="320.0" y="311.0" text-anchor="middle">RayGen</text><text class="s" x="320.0" y="327.0" text-anchor="middle">camera ray · Sobol</text></g><g class="k-logic"><rect class="nd" x="460" y="68" width="590" height="76" rx="7"/><text class="t" x="755.0" y="95.0" text-anchor="middle">Nearest geometric endpoint</text><text class="s" x="755.0" y="111.0" text-anchor="middle">TraceRay payload + analytic sphere intersection</text><text class="s" x="755.0" y="127.0" text-anchor="middle">ClosestHit: surface data · PrimaryMiss: miss flag only</text></g><g class="k-logic"><rect class="nd" x="590" y="195" width="330" height="80" rx="7"/><text class="t" x="755.0" y="224.0" text-anchor="middle">SampleMediumInteraction</text><text class="s" x="755.0" y="240.0" text-anchor="middle">transport to provisional endpoint</text><text class="s" x="755.0" y="256.0" text-anchor="middle">scatter / escape / absorb</text></g><g class="k-logic"><rect class="nd" x="460" y="315" width="260" height="82" rx="7"/><text class="t" x="590.0" y="345.0" text-anchor="middle">Medium scatter</text><text class="s" x="590.0" y="361.0" text-anchor="middle">phase NEE + shadow transmittance</text><text class="s" x="590.0" y="377.0" text-anchor="middle">Henyey–Greenstein phase sample</text></g><g class="k-logic"><rect class="nd" x="790" y="315" width="260" height="122" rx="7"/><text class="t" x="920.0" y="357.0" text-anchor="middle">Reached endpoint</text><text class="s" x="920.0" y="373.0" text-anchor="middle">pure boundary: update states, retry</text><text class="s" x="920.0" y="389.0" text-anchor="middle">surface: emission + NEE + BSDF</text><text class="s" x="920.0" y="405.0" text-anchor="middle">emitter / env: emission + MIS, end</text></g><g class="k-logic"><rect class="nd" x="620" y="454" width="270" height="76" rx="7"/><text class="t" x="755.0" y="481.0" text-anchor="middle">Continue sampled path</text><text class="s" x="755.0" y="497.0" text-anchor="middle">Russian roulette from depth 3</text><text class="s" x="755.0" y="513.0" text-anchor="middle">update throughput · next bounce</text></g><g class="k-res"><rect class="nd" x="620" y="608" width="185" height="56" rx="7"/><text class="t" x="712.5" y="633.0" text-anchor="middle">Accumulation</text><text class="s" x="712.5" y="649.0" text-anchor="middle">running mean: Σ L / N</text></g><g class="k-cmp"><rect class="nd" x="850" y="608" width="200" height="56" rx="7"/><text class="t" x="950.0" y="633.0" text-anchor="middle">Post Process</text><text class="s" x="950.0" y="649.0" text-anchor="middle">tone map</text></g><text class="lbl" x="328" y="246" text-anchor="start">initial medium state</text><text class="lbl" x="521" y="294" text-anchor="middle">scatter</text><text class="lbl" x="986" y="294" text-anchor="middle">escape</text><text class="lbl" x="755" y="301" text-anchor="middle">absorb → terminate</text><text class="lbl" x="956" y="475" text-anchor="start">BSDF</text><text class="lbl" x="1057" y="184" text-anchor="end">boundary</text><text class="lbl" x="557" y="548" text-anchor="middle">next bounce</text><text class="lbl" x="422" y="628" text-anchor="start">completed path radiance</text><text class="cap" x="20" y="415" text-anchor="start">NEE connections test visibility</text><text class="s" x="20" y="435" text-anchor="start">and estimate medium transmittance.</text><text class="s" x="20" y="466" text-anchor="start">Alpha mask: AnyHit</text><text class="s" x="20" y="484" text-anchor="start">Alpha blend: path-local sampling</text><text class="s" x="20" y="688" text-anchor="start">Path tracing and its medium transport are DXR-only.</text></svg>
