<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 420" role="img" aria-label="Frame pipeline: game thread, render thread, and render graph pass order"><title>Frame Pipeline</title><style>text{font-family:Consolas,"Liberation Mono",Menlo,monospace}
.nd{stroke-width:1.3}
.nd.strong{stroke-width:2}
.t{font-size:12.5px;font-weight:700}
.s{font-size:10.5px;fill:#5A6676}
.grp{stroke-width:1.3;stroke-dasharray:6 5}
.gl{font-size:11.5px;font-weight:700;letter-spacing:.03em}
.frm{fill:none;stroke:#D3DAE2;stroke-width:1.4;stroke-dasharray:6 5}
.e{fill:none;stroke:#18212C;stroke-width:1.4;stroke-linejoin:round}
.e.dash{stroke:#5A6676;stroke-dasharray:5 4}
.e.thin{stroke:#D3DAE2;stroke-width:1.4}
.mk{fill:#18212C} .mkd{fill:#5A6676}
.mkh{fill:#FBFCFD;stroke:#18212C;stroke-width:1.4;stroke-linejoin:round}
.lbl{font-size:10.5px;fill:#5A6676;paint-order:stroke;stroke:#FBFCFD;stroke-width:4px;stroke-linejoin:round}
.cap{font-size:11px;font-weight:700;fill:#5A6676;letter-spacing:.04em}
.k-app .nd{fill:#E8ECF1;stroke:#A9B3C1} .k-app .t{fill:#4A5568} .k-app .grp{fill:none;stroke:#A9B3C1} .k-app .gl{fill:#4A5568}
.k-eng .nd{fill:#DCEFF3;stroke:#8CC3CE} .k-eng .t{fill:#0B6E80} .k-eng .grp{fill:none;stroke:#8CC3CE} .k-eng .gl{fill:#0B6E80}
.k-com .nd{fill:#E6E5FA;stroke:#9D98E6} .k-com .t{fill:#4B44C9} .k-com .grp{fill:none;stroke:#9D98E6} .k-com .gl{fill:#4B44C9}
.k-dx .nd{fill:#DDF0E3;stroke:#96CDA8} .k-dx .t{fill:#1C7A3E} .k-dx .grp{fill:none;stroke:#96CDA8} .k-dx .gl{fill:#1C7A3E}
.k-vk .nd{fill:#F7E1DD;stroke:#E0A39B} .k-vk .t{fill:#AE2A1E} .k-vk .grp{fill:none;stroke:#E0A39B} .k-vk .gl{fill:#AE2A1E}
.k-ext .nd{fill:#EFE8DE;stroke:#C8B69D} .k-ext .t{fill:#7A6448} .k-ext .grp{fill:none;stroke:#C8B69D} .k-ext .gl{fill:#7A6448}
.k-cpu .nd{fill:#E8ECF1;stroke:#A9B3C1} .k-cpu .t{fill:#4A5568} .k-cpu .grp{fill:none;stroke:#A9B3C1} .k-cpu .gl{fill:#4A5568}
.k-cmp .nd{fill:#DCEFF3;stroke:#8CC3CE} .k-cmp .t{fill:#0B6E80} .k-cmp .grp{fill:none;stroke:#8CC3CE} .k-cmp .gl{fill:#0B6E80}
.k-mesh .nd{fill:#E6E5FA;stroke:#9D98E6} .k-mesh .t{fill:#4B44C9} .k-mesh .grp{fill:none;stroke:#9D98E6} .k-mesh .gl{fill:#4B44C9}
.k-rt .nd{fill:#FBE6DA;stroke:#E6A98A} .k-rt .t{fill:#B4431A} .k-rt .grp{fill:none;stroke:#E6A98A} .k-rt .gl{fill:#B4431A}
.k-logic .nd{fill:#FBFCFD;stroke:#8F9AAA} .k-logic .t{fill:#3C4656} .k-logic .grp{fill:none;stroke:#8F9AAA} .k-logic .gl{fill:#3C4656}
.k-res .nd{fill:#EFE8DE;stroke:#C8B69D} .k-res .t{fill:#7A6448} .k-res .grp{fill:none;stroke:#C8B69D} .k-res .gl{fill:#7A6448}
</style><rect width="100%" height="100%" fill="#FBFCFD"/><defs><marker id="f-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path class="mk" d="M0,0.5 L10,5 L0,9.5 Z"/></marker><marker id="f-ad" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path class="mkd" d="M0,0.5 L10,5 L0,9.5 Z"/></marker><marker id="f-tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path class="mkh" d="M1,1.5 L13,7 L1,12.5 Z"/></marker></defs><g class="k-cpu"><rect class="grp" x="20" y="20" width="500" height="110" rx="10"/><text class="gl" x="32" y="38">Game Thread</text></g><g class="k-cpu"><rect class="grp" x="690" y="20" width="420" height="110" rx="10"/><text class="gl" x="702" y="38">Render Thread</text></g><path class="e" d="M180.0,82.0 L200.0,82.0" marker-end="url(#f-a)"/><path class="e" d="M340.0,82.0 L360.0,82.0" marker-end="url(#f-a)"/><path class="e" d="M500.0,82.0 L545.0,82.0" marker-end="url(#f-a)"/><path class="e" d="M665.0,82.0 L705.0,82.0" marker-end="url(#f-a)"/><path class="e" d="M825.0,82.0 L840.0,82.0" marker-end="url(#f-a)"/><path class="e" d="M960.0,82.0 L975.0,82.0" marker-end="url(#f-a)"/><path class="e thin" d="M900.0,112.0 L900.0,158.0"/><path class="e thin" d="M21.0,158.0 L1109.0,158.0"/><path class="e" d="M161.0,219.0 L179.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M319.0,219.0 L337.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M477.0,219.0 L495.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M635.0,219.0 L653.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M793.0,219.0 L811.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M951.0,219.0 L969.0,219.0" marker-end="url(#f-a)"/><path class="e" d="M161.0,349.0 L179.0,349.0" marker-end="url(#f-a)"/><path class="e" d="M951.0,349.0 L1039.0,349.0 L1039.0,248.0" marker-end="url(#f-a)"/><g class="k-cpu"><rect class="nd" x="40" y="52" width="140" height="60" rx="7"/><text class="t" x="110.0" y="86.5" text-anchor="middle">Input</text></g><g class="k-cpu"><rect class="nd" x="200" y="52" width="140" height="60" rx="7"/><text class="t" x="270.0" y="79.0" text-anchor="middle">Scene Update</text><text class="s" x="270.0" y="95.0" text-anchor="middle">ECS Systems</text></g><g class="k-cpu"><rect class="nd" x="360" y="52" width="140" height="60" rx="7"/><text class="t" x="430.0" y="79.0" text-anchor="middle">SceneRenderView</text><text class="s" x="430.0" y="95.0" text-anchor="middle">snapshot</text></g><g class="k-res"><rect class="nd" x="545" y="52" width="120" height="60" rx="7"/><text class="t" x="605.0" y="79.0" text-anchor="middle">ThreadQueue</text><text class="s" x="605.0" y="95.0" text-anchor="middle">≤ 3 frames</text></g><g class="k-cpu"><rect class="nd" x="705" y="52" width="120" height="60" rx="7"/><text class="t" x="765.0" y="79.0" text-anchor="middle">Scene Upload</text><text class="s" x="765.0" y="95.0" text-anchor="middle">GPU buffers · AS</text></g><g class="k-cpu"><rect class="nd" x="840" y="52" width="120" height="60" rx="7"/><text class="t" x="900.0" y="79.0" text-anchor="middle">Render Graph</text><text class="s" x="900.0" y="95.0" text-anchor="middle">RenderNodes</text></g><g class="k-cpu"><rect class="nd" x="975" y="52" width="120" height="60" rx="7"/><text class="t" x="1035.0" y="79.0" text-anchor="middle">Present</text><text class="s" x="1035.0" y="95.0" text-anchor="middle">ImGui · swap</text></g><g class="k-cmp"><rect class="nd" x="21" y="190" width="140" height="58" rx="7"/><text class="t" x="91.0" y="216.0" text-anchor="middle">Atmosphere</text><text class="s" x="91.0" y="232.0" text-anchor="middle">LUT · cloud noise</text></g><g class="k-cmp"><rect class="nd" x="179" y="190" width="140" height="58" rx="7"/><text class="t" x="249.0" y="216.0" text-anchor="middle">Light Culling</text><text class="s" x="249.0" y="232.0" text-anchor="middle">cluster build</text></g><g class="k-mesh"><rect class="nd" x="337" y="190" width="140" height="58" rx="7"/><text class="t" x="407.0" y="216.0" text-anchor="middle">GPU Culling</text><text class="s" x="407.0" y="232.0" text-anchor="middle">→ Visibility Buffer</text></g><g class="k-cmp"><rect class="nd" x="495" y="190" width="140" height="58" rx="7"/><text class="t" x="565.0" y="216.0" text-anchor="middle">Surface Resolve</text><text class="s" x="565.0" y="232.0" text-anchor="middle">surface · velocity</text></g><g class="k-cmp"><rect class="nd" x="653" y="190" width="140" height="58" rx="7"/><text class="t" x="723.0" y="216.0" text-anchor="middle">Clouds · Sky</text><text class="s" x="723.0" y="232.0" text-anchor="middle">volumetric scatter</text></g><g class="k-cmp"><rect class="nd" x="811" y="190" width="140" height="58" rx="7"/><text class="t" x="881.0" y="216.0" text-anchor="middle">Lighting</text><text class="s" x="881.0" y="232.0" text-anchor="middle">clustered deferred</text></g><g class="k-cmp"><rect class="nd" x="969" y="190" width="140" height="58" rx="7"/><text class="t" x="1039.0" y="216.0" text-anchor="middle">Post Process</text><text class="s" x="1039.0" y="232.0" text-anchor="middle">TAA · Bloom · Tone</text></g><g class="k-cmp"><rect class="nd" x="21" y="320" width="140" height="58" rx="7"/><text class="t" x="91.0" y="346.0" text-anchor="middle">Skybox</text><text class="s" x="91.0" y="362.0" text-anchor="middle">env map</text></g><g class="k-rt"><rect class="nd strong" x="179" y="320" width="772" height="58" rx="7"/><text class="t" x="565.0" y="346.0" text-anchor="middle">DXR Path Tracer</text><text class="s" x="565.0" y="362.0" text-anchor="middle">progressive accumulation</text></g><text class="cap" x="21" y="180" text-anchor="start">Raster  (ExampleApp)</text><text class="cap" x="21" y="310" text-anchor="start">Path Tracing  (RayTracingApp)</text></svg>
