<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-label="GPU-driven two-phase occlusion culling with meshlet task/mesh shaders into a visibility buffer"><title>GPU-Driven Culling</title><style>text{font-family:Consolas,"Liberation Mono",Menlo,monospace}
.nd{stroke-width:1.3}
