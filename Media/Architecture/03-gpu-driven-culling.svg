 y="89.0" text-anchor="middle">Indirect Args</text><text class="s" x="455.0" y="105.0" text-anchor="middle">ExecuteIndirect</text></g><g class="k-mesh"><rect class="nd" x="560" y="62" width="160" height="60" rx="7"/><text class="t" x="640.0" y="89.0" text-anchor="middle">Task Shader</text><text class="s" x="640.0" y="105.0" text-anchor="middle">meshlet frustum · cone</text></g><g class="k-mesh"><rect class="nd" x="755" y="62" width="130" height="60" rx="7"/><text class="t" x="820.0" y="89.0" text-anchor="middle">Mesh Shader</text><text class="s" x="820.0" y="105.0" text-anchor="middle">triangle cull</text></g><g class="k-mesh"><rect class="nd" x="920" y="62" width="160" height="60" rx="7"/><text class="t" x="1000.0" y="89.0" text-anchor="middle">Pixel Shader</text><text class="s" x="1000.0" y="105.0" text-anchor="middle">VBuffer + Depth</text></g><g class="k-cmp"><rect class="nd" x="200" y="262" width="150" height="60" rx="7"/><text class="t" x="275.0" y="289.0" text-anchor="middle">Instance Cull</text><text class="s" x="275.0" y="305.0" text-anchor="middle">frustum · HiZ</text></g><g class="k-res"><rect class="nd" x="385" y="262" width="140" height="60" rx="7"/><text class="t" x="455.0" y="289.0" text-anchor="middle">Indirect Args</text><text class="s" x="455.0" y="305.0" text-anchor="middle">ExecuteIndirect</text></g><g class="k-mesh"><rect class="nd" x="560" y="262" width="160" height="60" rx="7"/><text class="t" x="640.0" y="289.0" text-anchor="middle">Task Shader</text><text class="s" x="640.0" y="305.0" text-anchor="middle">meshlet HiZ</text></g><g class="k-mesh"><rect class="nd" x="755" y="262" width="130" height="60" rx="7"/><text class="t" x="820.0" y="289.0" text-anchor="middle">Mesh Shader</text><text class="s" x="820.0" y="305.0" text-anchor="middle">triangle cull</text></g><g class="k-mesh"><rect class="nd" x="920" y="262" width="160" height="60" rx="7"/><text class="t" x="1000.0" y="289.0" text-anchor="middle">Pixel Shader</text><text class="s" x="1000.0" y="305.0" text-anchor="middle">VBuffer + Depth</text></g><g class="k-cmp"><rect class="nd" x="920" y="162" width="160" height="56" rx="7"/><text class="t" x="1000.0" y="187.0" text-anchor="middle">HiZ Build</text><text class="s" x="1000.0" y="203.0" text-anchor="middle">from Phase 1 depth</text></g><g class="k-res"><rect class="nd" x="20" y="162" width="145" height="56" rx="7"/><text class="t" x="92.5" y="187.0" text-anchor="middle">Visibility Bits</text><text class="s" x="92.5" y="203.0" text-anchor="middle">instance · meshlet</text></g><g class="k-cmp"><rect class="nd" x="920" y="370" width="160" height="52" rx="7"/><text class="t" x="1000.0" y="393.0" text-anchor="middle">Surface Resolve</text><text class="s" x="1000.0" y="409.0" text-anchor="middle">→ Lighting</text></g><text class="cap" x="200" y="50" text-anchor="start">PHASE 1  ·  last-frame visible</text><text class="cap" x="200" y="250" text-anchor="start">PHASE 2  ·  HiZ occlusion</text><text class="lbl" x="150" y="285" text-anchor="middle">write</text><text class="lbl" x="146" y="85" text-anchor="middle">read · next frame</text><text class="s" x="20" y="465" text-anchor="start">Scope: scene geometry draw submissions; UI and post-process use separate passes.</text><text class="s" x="20" y="485" text-anchor="start">Draw counts and optional meshlet statistics use a CPU readback ring.</text><text class="s" x="20" y="505" text-anchor="start">TerrainApp: Marching Cubes + Transvoxel chunk geometry feeds this culling path.</text></svg>
